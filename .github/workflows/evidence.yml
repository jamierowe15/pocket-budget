name: Evidence
# Started by `bash pocket-budget-lab.sh evidence`. Produces screenshots, a GIF, the
# accessibility audit and coverage as the `evidence` artifact.
on:
  workflow_dispatch:

jobs:
  evidence:
    name: evidence
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen ffmpeg
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Produce evidence
        run: bash scripts/ci/evidence.sh all
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
