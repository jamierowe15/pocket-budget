included:
  - App
  - Packages
  - Widget
  - AppTests
  - UITests
excluded:
  - Packages/*/.build
disabled_rules:
  - trailing_comma
  - todo
opt_in_rules:
  - empty_count
  - first_where
  - closure_spacing
line_length:
  warning: 140
  error: 200
identifier_name:
  min_length: 1
  excluded: [id, x, y]
type_name:
  min_length: 2
function_body_length:
  warning: 80
  error: 150
file_length:
  warning: 600
  error: 1200
large_tuple:
  warning: 3
  error: 4
